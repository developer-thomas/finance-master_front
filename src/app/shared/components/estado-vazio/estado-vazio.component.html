<div class="flex flex-col items-center px-6 py-10 text-center">
  <span class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-marca-50 text-marca-600">
    <ion-icon [name]="icone()" aria-hidden="true"></ion-icon>
  </span>
  <h3 class="m-0 text-base font-semibold text-slate-900">{{ titulo() }}</h3>
  @if (texto()) {
    <p class="mx-auto mb-0 mt-1.5 max-w-xs text-sm leading-relaxed text-slate-500">{{ texto() }}</p>
  }
  <div class="mt-5 flex w-full max-w-xs flex-col gap-2 empty:hidden">
    <ng-content></ng-content>
  </div>
</div>
