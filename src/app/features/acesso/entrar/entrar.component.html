<app-moldura-acesso titulo="Entrar" subtitulo="Acompanhe suas contas e registre o dia.">
  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="entrar()" novalidate>
    <div>
      <ion-input
        class="fm-input"
        fill="outline"
        label="E-mail"
        labelPlacement="stacked"
        type="email"
        inputmode="email"
        autocomplete="email"
        formControlName="email"
        errorText="Informe um e-mail válido."
      ></ion-input>
    </div>

    <div>
      <ion-input
        class="fm-input"
        fill="outline"
        label="Senha"
        labelPlacement="stacked"
        [type]="verSenha() ? 'text' : 'password'"
        autocomplete="current-password"
        formControlName="senha"
        errorText="Informe a senha."
      >
        <ion-button
          slot="end"
          fill="clear"
          color="medium"
          type="button"
          [attr.aria-label]="verSenha() ? 'Esconder senha' : 'Mostrar senha'"
          (click)="verSenha.set(!verSenha())"
        >
          <ion-icon slot="icon-only" [name]="verSenha() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </ion-button>
      </ion-input>
    </div>

    @if (erro()) {
      <div class="flex items-start gap-2 rounded-xl bg-despesa-50 px-3 py-2.5 text-sm text-despesa-700" role="alert">
        <ion-icon class="mt-0.5 shrink-0" name="alert-circle-outline" aria-hidden="true"></ion-icon>
        <span>{{ erro() }}</span>
      </div>
    }

    <ion-button class="mt-2" expand="block" type="submit" [disabled]="enviando()">
      @if (enviando()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Entrar
      }
    </ion-button>
  </form>

  <p class="m-0 mt-8 text-center text-sm text-slate-500">
    Ainda não tem conta?
    <a class="font-semibold text-marca-700 no-underline" routerLink="/criar-conta">Criar conta</a>
  </p>
  <p class="m-0 mt-3 text-center text-xs text-slate-400">
    Dev local: <span class="fm-numero">demo@financemaster.local</span> / <span class="fm-numero">demosenha</span>
  </p>
</app-moldura-acesso>
